<main class="main-summary" [class.is-guest-mode]="isGuest()">
  <summary id="summaryContent">
    <header class="summary__header">
      <h1>Join 360</h1>
      <div class="header-divider-wrapper">
        <div class="header-divider" aria-hidden="true"></div>
        <p>Key Metrics at a Glance</p>
      </div>
    </header>

    <div class="summary__grid">
      <section class="summary__stats-panel" aria-label="Task statistics overview">
        <div class="stats-row-top">
            <article
              *ngFor="let card of topStatsCards()"
              [class]="card.class"
              [attr.aria-labelledby]="card.id + '-label'"
              (click)="navigateToBoard()"
            >
              <div class="card-icon-wrapper">
                <img
                  class="icon-default"
                  [src]="card.iconDefault"
                  alt=""
                  aria-hidden="true"
                />
                <img
                  class="icon-hover"
                  [src]="card.iconHover"
                  alt=""
                  aria-hidden="true"
                />
              </div>
              <div class="card-content">
                <h4 [attr.aria-label]="card.ariaLabel">
                  {{ card.value }}
                </h4>
                <p [id]="card.id + '-label'">{{ card.label }}</p>
              </div>
            </article>
        </div>

        <div class="stats-row-middle">
          <article
            class="summary__card--urgent"
            aria-labelledby="urgent-label"
            (click)="navigateToBoard()"
          >
            <div class="urgent-left">
              <div class="urgent-icon-wrapper">
                <img
                  src="assets/images/urgentwhite.svg"
                  alt=" Urgent tasks icon"
                  aria-hidden="true"
                />
              </div>
              <div class="urgent-info">
                <h3 [attr.aria-label]="taskStats().urgent + ' urgent tasks'">
                  {{ taskStats().urgent }}
                </h3>
                <p id="urgent-label">Urgent</p>
              </div>
            </div>
            <div class="urgent-divider" aria-hidden="true"></div>
            <div class="urgent-right">
              <time
                class="deadline-date"
                [attr.datetime]="formattedDeadline()"
                >{{ formattedDeadline() }}</time
              >
              <p class="deadline-label">Upcoming Deadline</p>
            </div>
          </article>

          <article
            class="summary__card--email"
            aria-labelledby="email-label"
            (click)="navigateToBoard()"
          >
            <div class="email-content">
              <h4 [attr.aria-label]="emailRequestsTasks() + ' email requests'">
                {{ emailRequestsTasks() }}
              </h4>
              <p id="email-label">Email<br />requests</p>
            </div>
          </article>
        </div>

        <div class="stats-row-bottom">
          <article
            *ngFor="let card of bottomStatsCards()"
            class="summary__card--stat"
            [attr.aria-labelledby]="card.id + '-label'"
            (click)="navigateToBoard()"
          >
            <div class="stat-content">
              <h3 [attr.aria-label]="card.ariaLabel">
                {{ card.value }}
              </h3>
              <p [id]="card.id + '-label'" [innerHTML]="card.label"></p>
            </div>
          </article>
        </div>
      </section>

      <aside
        class="summary__greeting"
        *ngIf="!isGuest()"
        aria-label="User greeting"
      >
        <h2 id="greeting">{{ greeting }}</h2>
        <h3 id="userName">{{ userName() || "User" }}</h3>
      </aside>
    </div>
  </summary>
</main>

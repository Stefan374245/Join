<main class="email-form">
  <header class="header">
    <img src="assets/images/joinlogodark.svg" alt="Join Logo" class="logo" />
  </header>

  <div class="desktop-header">
    <a (click)="goBack()" class="back-link-desktop" aria-label="Back">
      <img src="assets/images/arrowbackblue.svg" alt="arrow-back" />
    </a>
  </div>

  <article class="content">
    <div class="title-section">
      <h1>Submit Your Request</h1>
      <a (click)="goBack()" class="back-link-mobile" aria-label="Back">
        <img src="assets/images/arrow-left-line.svg" alt="arrow-back" />
      </a>
    </div>

    @if (isLimitReached) {
      <div class="limit-banner">
        The daily {{ maxRequests }}-request limit has been reached!
      </div>
    }

    <form class="request-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="requestType">Request Type *</label>
        <app-dropdown
          id="requestType"
          [items]="requestTypeItems"
          [selectedIds]="[requestType]"
          placeholder="Select request type"
          [searchable]="false"
          [multiple]="false"
          [showClearButton]="false"
          (selectionChange)="onRequestTypeChange($event)"
        ></app-dropdown>
      </div>

      <div class="form-group">
        <label for="requestTitle">Title *</label>
        <input
          type="text"
          id="requestTitle"
          [(ngModel)]="requestTitle"
          name="requestTitle"
          placeholder="Brief description of your request"
          required
        />
      </div>

      <div class="form-group">
        <label for="requestDescription">Description *</label>
        <textarea
          id="requestDescription"
          [(ngModel)]="requestDescription"
          name="requestDescription"
          rows="6"
          placeholder="Please provide detailed information about your request..."
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="stakeholderName">Your Name</label>
        <input
          type="text"
          id="stakeholderName"
          [(ngModel)]="stakeholderName"
          name="stakeholderName"
          placeholder="John Doe"
        />
      </div>

      <div class="form-group">
        <label for="stakeholderEmail">Your Email *</label>
        <input
          type="email"
          id="stakeholderEmail"
          [(ngModel)]="stakeholderEmail"
          name="stakeholderEmail"
          placeholder="john@example.com"
          required
        />
      </div>

      @if (submitError) {
        <div class="error-message">{{ submitError }}</div>
      }

      @if (submitSuccess) {
        <div class="success-message">
          ✅ Request submitted successfully! Redirecting...
        </div>
      }

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="isSubmitting || isLimitReached"
      >
        @if (isSubmitting) {
          <span>Submitting...</span>
        } @else {
          <span>Submit Request</span>
        }
      </button>
    </form>
  </article>

  <app-footer-auth />
</main>

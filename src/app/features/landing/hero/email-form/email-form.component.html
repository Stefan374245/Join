<main class="email-form">
  <header class="header">
    <img src="assets/images/joinlogodark.svg" alt="Join Logo" class="logo" />
  </header>

  <div class="desktop-header">
    <a (click)="goBack()" class="back-link-desktop" aria-label="Back">
      <img src="assets/images/arrowbackblue.svg" alt="arrow-back" />
    </a>
  </div>

  <article class="content">
    <div class="title-section">
      <h1>Submit Your Request</h1>
      <a (click)="goBack()" class="back-link-mobile" aria-label="Back">
        <img src="assets/images/arrow-left-line.svg" alt="arrow-back" />
      </a>
    </div>

    @if (isLimitReached) {
      <div class="limit-banner">
        The daily {{ maxRequests }}-request limit has been reached!
      </div>
    }

    <form class="request-form" [formGroup]="requestForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="requestType" class="form-label">Request Type <span class="required">*</span></label>
        <app-dropdown
          id="requestType"
          [items]="requestTypeItems"
          [selectedIds]="[getControl('requestType').value]"
          placeholder="Select request type"
          [searchable]="false"
          [multiple]="false"
          [showClearButton]="false"
          (selectionChange)="onRequestTypeChange($event)"
          (closed)="onRequestTypeBlur()"
        ></app-dropdown>

        @if (requestTypeHasError()) {
          <span class="field-error-message" role="alert">Request type is required</span>
        }
      </div>

      <app-form-input
        id="requestTitle"
        label="Title"
        [control]="getControl('requestTitle')"
        type="text"
        placeholder="Brief description of your request"
        [required]="true"
        [labelVisible]="true"
      />

      <app-form-field
        id="requestDescription"
        label="Description"
        type="textarea"
        [control]="getControl('requestDescription')"
        [rows]="6"
        placeholder="Please provide detailed information about your request..."
        [required]="true"
        errorMessage="Description is required, min 10 characters"
      />

      <app-form-input
        id="stakeholderName"
        label="Your Name"
        [control]="getControl('stakeholderName')"
        type="text"
        placeholder="John Doe"
        [labelVisible]="true"
      />

      <app-form-input
        id="stakeholderEmail"
        label="Your Email"
        [control]="getControl('stakeholderEmail')"
        type="email"
        placeholder="john@example.com"
        [required]="true"
        [labelVisible]="true"
      />

      @if (submitError) {
        <div class="error-message">{{ submitError }}</div>
      }

      @if (submitSuccess) {
        <div class="success-message">
          ✅ Request submitted successfully! Redirecting...
        </div>
      }

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="isSubmitting || isLimitReached"
      >
        @if (isSubmitting) {
          <span>Submitting...</span>
        } @else {
          <span>Submit Request</span>
        }
      </button>
    </form>
  </article>

  <app-footer-auth />
</main>

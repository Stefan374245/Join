<div class="dropdown-container" (clickOutside)="onClickOutside()">
  <div class="dropdown-trigger-wrapper">
    <button
      type="button"
      [id]="id()"
      class="dropdown-trigger"
      [class.open]="isOpen()"
      [class.has-selection]="hasSelection()"
      [disabled]="disabled()"
      [attr.aria-expanded]="ariaExpanded()"
      [attr.aria-haspopup]="'listbox'"
      [attr.aria-controls]="id() + '-listbox'"
      [attr.aria-activedescendant]="ariaActiveDescendant()"
      (click)="toggleDropdown()"
      (keydown)="onKeyDown($event)"
    >
      <span class="dropdown-label">{{ displayText() }}</span>
      <svg
        class="dropdown-arrow"
        [class.rotated]="isOpen()"
        width="14"
        height="8"
        viewBox="0 0 14 8"
        fill="none"
      >
        <path
          d="M1 1L7 7L13 1"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
    @if (hasSelection() && !disabled() && showClearButton()) {
      <button
        type="button"
        class="clear-button"
        aria-label="Clear selection"
        (click)="clearSelection($event)"
      >
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path
            d="M7 0C3.13438 0 0 3.13438 0 7C0 10.8656 3.13438 14 7 14C10.8656 14 14 10.8656 14 7C14 3.13438 10.8656 0 7 0ZM9.91875 8.73125C10.0875 8.9 10.0875 9.175 9.91875 9.34375L9.34375 9.91875C9.175 10.0875 8.9 10.0875 8.73125 9.91875L7 8.1875L5.26875 9.91875C5.1 10.0875 4.825 10.0875 4.65625 9.91875L4.08125 9.34375C3.9125 9.175 3.9125 8.9 4.08125 8.73125L5.8125 7L4.08125 5.26875C3.9125 5.1 3.9125 4.825 4.08125 4.65625L4.65625 4.08125C4.825 3.9125 5.1 3.9125 5.26875 4.08125L7 5.8125L8.73125 4.08125C8.9 3.9125 9.175 3.9125 9.34375 4.08125L9.91875 4.65625C10.0875 4.825 10.0875 5.1 9.91875 5.26875L8.1875 7L9.91875 8.73125Z"
            fill="currentColor"
          />
        </svg>
      </button>
    }
  </div>

  @if (isOpen()) {
    <ul
      class="dropdown-list dropdown-menu"
      [id]="id() + '-listbox'"
      role="listbox"
      [attr.aria-labelledby]="id()"
      [attr.aria-multiselectable]="multiple()"
      [style.max-height]="maxHeight()"
      [attr.title]="maxHeight()"
    >
      @if (searchable()) {
        <li class="search-wrapper" role="presentation">
          <input
            type="text"
            class="search-input"
            [placeholder]="searchPlaceholder()"
            [(ngModel)]="searchQuery"
            stopPropagation
            aria-label="Search items"
          />
          <svg
            class="search-icon"
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
          >
            <path
              d="M7.5 13.5C10.8137 13.5 13.5 10.8137 13.5 7.5C13.5 4.18629 10.8137 1.5 7.5 1.5C4.18629 1.5 1.5 4.18629 1.5 7.5C1.5 10.8137 4.18629 13.5 7.5 13.5Z"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M16.5 16.5L11.625 11.625"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </li>
      }
      @for (item of filteredItems(); track trackByItemId($index, item)) {
        <li
          class="dropdown-item"
          [id]="id() + '-item-' + item.id"
          [class.selected]="isSelected()(item.id)"
          [class.focused]="focusedIndex() === $index"
          [class.disabled]="item.disabled"
          role="option"
          [attr.aria-selected]="isSelected()(item.id)"
          [attr.aria-disabled]="item.disabled"
          (click)="selectItem(item)"
          (mouseenter)="focusedIndex.set($index)"
        >
          <span *ngIf="hasAvatarImage(item)" class="item-icon-wrapper">
            <img
              [src]="getAvatarUrl(item)"
              [alt]="item.label"
              class="item-icon"
              title="avatar"
            />
          </span>
          <span *ngIf="!hasAvatarImage(item) && hasColor(item)" class="avatar" [style.background-color]="getColor(item)">
            {{ getInitials(item.label) }}
          </span>
          <span *ngIf="!hasAvatarImage(item) && !hasColor(item) && item.icon" class="item-icon-wrapper">
            <img
              [src]="item.icon"
              [alt]="item.label"
              class="item-icon"
              title="icon"
              aria-hidden="true"
            />
          </span>
          <span class="item-label" [title]="item.label">{{ item.label }}</span>
          <span *ngIf="multiple()" class="checkbox-indicator" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <rect x="2" y="2" width="12" height="12" rx="3" fill="#fff" stroke="#bbb" stroke-width="2" />
              <path *ngIf="isSelected()(item.id)" d="M4 8l3 3 5-5" stroke="#29ABE2" stroke-width="2" fill="none" />
            </svg>
          </span>
          <span *ngIf="!multiple() && isSelected()(item.id)" class="check-indicator" aria-hidden="true">
            <svg class="check-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path
                d="M13.5 4L6 11.5L2.5 8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </li>
      } @empty {
        <li class="dropdown-item empty">No results found</li>
      }
    </ul>
  }
</div>

<app-toast></app-toast>

<div class="subtask-input-wrapper">
  <input
    type="text"
    class="subtask-input"
    [formControl]="subtaskInputControl()"
    [placeholder]="inputPlaceholder()"
    [disabled]="!canAddMore()"
    [maxlength]="35"
    (keydown)="onAddInputKeydown($event)"
    (focus)="onAddInputFocus()"
    (blur)="onAddInputBlur()"
    #addInput
    aria-label="Add new subtask"
  />
  
  <button
    *ngIf="!isInputFocused() && !subtaskInputControl().value?.trim()"
    type="button"
    class="subtask-add-button"
    [disabled]="!canAddMore()"
    (click)="addInput.focus()"
    aria-label="Add subtask"
  >
    <img 
      src="assets/images/addDark.svg" 
      alt="Add subtask"
      class="add-icon"
    />
  </button>

  <div class="subtask-actions" *ngIf="isInputFocused() || subtaskInputControl().value?.trim()">
    <button
      type="button"
      class="subtask-icon-button"
      (click)="onClearInput()"
      aria-label="Clear subtask input"
    >
      <img
        src="assets/images/close.svg"
        alt="Clear"
        class="subtask-icon"
      />
    </button>
    <div class="subtask-divider" aria-hidden="true"></div>
    <button
      type="button"
      class="subtask-icon-button"
      (click)="onAddSubtask()"
      [disabled]="!subtaskInputControl().value?.trim()"
      aria-label="Add subtask"
    >
      <img
        src="assets/images/checkDark.svg"
        alt="Add"
        class="subtask-icon"
      />
    </button>
  </div>
</div>

<ul class="subtasks-list" *ngIf="subtasks().length > 0" role="list" aria-label="Subtasks">
  <li *ngFor="let subtask of visibleSubtasks()" class="subtask-item" role="listitem">
    <span class="subtask-text" *ngIf="editingSubtaskId() !== subtask.id">{{ subtask.title }}</span>

    <div class="subtask-edit-wrapper" *ngIf="editingSubtaskId() === subtask.id">
      <input
        type="text"
        class="subtask-edit-input"
        [value]="editInputValue()"
        (input)="editInputValue.set($any($event.target).value); subtaskEditInputChange.emit($any($event.target).value)"
        placeholder="Edit subtask"
        (keydown.enter)="onUpdate()"
        preventDefault="keydown.enter"
        (keydown.escape)="onCancelEdit()"
        (blur)="onInputBlur($event)"
        maxlength="35"
        #editInput
        aria-label="Edit subtask"
      />
      <div class="subtask-edit-actions">
        <img
          src="assets/images/close.svg"
          alt="Cancel edit"
          class="subtask-edit-icon subtask-edit-clear"
          (click)="onCancelEdit()"
          role="button"
          tabindex="0" />
        <div class="subtask-edit-divider" aria-hidden="true"></div>
        <img
          src="assets/images/checkDark.svg"
          alt="Save subtask"
          class="subtask-edit-icon subtask-edit-add"
          (click)="onUpdate()"
          role="button"
          tabindex="0" />
      </div>
    </div>

    <div class="subtask-actions" *ngIf="editingSubtaskId() !== subtask.id">
      <img
        src="assets/images/edit-2.svg"
        alt="Edit subtask"
        class="subtask-action-icon"
        (click)="onEdit(subtask)"
        role="button"
        tabindex="0" />
      <div class="vertical-line-subtask" aria-hidden="true"></div>
      <img
        src="assets/images/delete.svg"
        alt="Delete subtask"
        class="subtask-action-icon"
        (click)="onDelete(subtask.id)"
        role="button"
        tabindex="0" />
    </div>
  </li>
  
  <li *ngIf="remainingSubtasksCount() > 0"
      class="subtask-item remaining-count"
      role="listitem"
      (click)="toggleDropdown()"
      (clickOutside)="closeDropdown()"
      [class.active]="isDropdownOpen()">
    <div class="remaining-count-content">
      <span class="subtask-text">+{{ remainingSubtasksCount() }} more</span>
      <img src="assets/images/arrow_drop_down.svg"
           alt="Show more subtasks"
           class="dropdown-icon"
           role="button"
           tabindex="0"/>
    </div>
    <div class="subtasks-dropdown" *ngIf="isDropdownOpen()">
      <ul class="dropdown-list" role="list">
        <li *ngFor="let subtask of remainingSubtasks()"
            class="dropdown-item"
            role="listitem">
          <span class="subtask-text" *ngIf="editingSubtaskId() !== subtask.id">{{ subtask.title }}</span>

          <div class="subtask-edit-wrapper" *ngIf="editingSubtaskId() === subtask.id">
            <input
              type="text"
              class="subtask-edit-input"
              [value]="editInputValue()"
              (input)="editInputValue.set($any($event.target).value); subtaskEditInputChange.emit($any($event.target).value)"
              placeholder="Edit subtask"
              (keydown.enter)="onUpdate()"
              preventDefault="keydown.enter"
              (keydown.escape)="onCancelEdit()"
              (blur)="onInputBlur($event)"
              maxlength="35"
              #editInput
              aria-label="Edit subtask"
            />
            <div class="subtask-edit-actions">
              <img
                src="assets/images/close.svg"
                alt="Cancel edit"
                class="subtask-edit-icon subtask-edit-clear"
                (click)="onCancelEdit()"
                stopPropagation
                role="button"
                tabindex="0" />
              <div class="subtask-edit-divider" aria-hidden="true"></div>
              <img
                src="assets/images/checkDark.svg"
                alt="Save subtask"
                class="subtask-edit-icon subtask-edit-add"
                (click)="onUpdate()"
                stopPropagation
                role="button"
                tabindex="0" />
            </div>
          </div>
          
          <div class="subtask-item-actions" *ngIf="editingSubtaskId() !== subtask.id">
            <img src="assets/images/edit-2.svg"
                 alt="Edit subtask"
                 class="subtask-action-icon"
                 (click)="onEdit(subtask)"
                 stopPropagation
                 role="button"
                 tabindex="0"/>
            <div class="vertical-line-subtask" aria-hidden="true"></div>
            <img src="assets/images/delete.svg"
                 alt="Delete subtask"
                 class="subtask-action-icon"
                 (click)="onDelete(subtask.id)"
                 stopPropagation
                 role="button"
                 tabindex="0"/>
          </div>
        </li>
      </ul>
    </div>
  </li>
</ul>

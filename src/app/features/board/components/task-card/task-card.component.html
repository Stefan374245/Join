<article
  class="task-card"
  cdkDrag
  [cdkDragData]="task"
  [cdkDragStartDelay]="80"
  [attr.data-task-id]="task.id"
  (click)="onTaskClick()"
>
  <div class="drag-placeholder" *cdkDragPlaceholder></div>

  <span
    class="task-category"
    [ngClass]="getCategoryClass(task.category)"
  >
    {{ task.category }}
  </span>
  <h3 class="task-title">{{ task.title }}</h3>
  <p class="task-description">
    {{ getShortDescription(task.description) }}
  </p>

  <div
    class="task-progress"
    title="Subtask progress"
    aria-label="Subtask progress"
    *ngIf="task.subtasks && task.subtasks.length > 0"
    [ngClass]="{
      'all-completed': areAllSubtasksCompleted(task),
      'has-incomplete': hasIncompleteSubtasks(task)
    }"
    role="progressbar"
    [attr.aria-valuenow]="getSubtaskProgress(task)"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-label]="
      getCompletedSubtasks(task) +
      ' of ' +
      task.subtasks.length +
      ' subtasks completed'
    "
  >
    <div class="progress-bar">
      <div
        class="progress-fill"
        [style.width.%]="getSubtaskProgress(task)"
      ></div>
    </div>
    <span class="progress-text">
      {{ getCompletedSubtasks(task) }}/{{ task.subtasks.length }}
      Subtasks
    </span>
  </div>

  <footer class="task-footer">
    <div
      class="task-assignees"
      role="list"
      aria-label="Assigned contacts"
    >
      <div
        class="assignee-avatar"
        *ngFor="let userId of task.assignedTo.slice(0, 3)"
        [style.background-color]="getContactColor(userId)"
        role="listitem"
        [attr.aria-label]="getContactInitials(userId)"
      >
        {{ getContactInitials(userId) }}
      </div>
      <div
        class="assignee-avatar more"
        *ngIf="task.assignedTo.length > 3"
        role="listitem"
      >
        +{{ task.assignedTo.length - 3 }}
      </div>
    </div>
    <div
      class="task-priority"
      [ngClass]="'priority-' + task.priority"
      [attr.aria-label]="task.priority + ' priority'"
    >
      <img
        [src]="getPriorityIcon(task.priority)"
        [alt]="task.priority + ' priority'"
        title="priority"
      />
    </div>
  </footer>
</article>

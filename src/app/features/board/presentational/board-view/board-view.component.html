<main class="board-container">
  <header class="board-header">
    <h1 class="board-title">Board</h1>

    <nav class="board-actions" aria-label="Board actions">
      <div class="search-wrapper" role="search">
        <input
          type="text"
          class="search-input"
          placeholder="Find Task"
          [ngModel]="taskService.searchQuery()"
          (ngModelChange)="taskService.setSearchQuery($event)"
          aria-label="Search tasks"
        />
        <div class="separator"></div>
        <img
          src="assets/images/search.svg"
          alt="Search icon"
          class="search-icon"
          title="Search"
        />
      </div>

      <button
        class="btn-add-task"
        (click)="openAddTaskModal()"
        aria-label="Add new task"
      >
        <span>Add task</span>
        <img
          src="assets/images/add.svg"
          alt="Add"
          title="Add"
          class="add-icon"

        />
      </button>
    </nav>
  </header>

  <div class="board-loading" *ngIf="loading()">
    <app-loading-spinner></app-loading-spinner>
  </div>
  <ng-container *ngIf="!loading()">
    <section class="board-columns" aria-label="Task board columns">
      <app-board-column
        *ngFor="let column of columns"
        [columnId]="column.id"
        [title]="column.title"
        [tasks]="column.getTasks()"
        [contacts]="contacts()"
        [loading]="loading()"
        (taskDropped)="onTaskDrop($event.event, $event.status)"
        (addTaskClicked)="openAddTaskModal($event)"
        (taskClicked)="openTaskDetail($event)"
        (addButtonHover)="onAddButtonHover($event.event, $event.isHover)"
      ></app-board-column>
    </section>
  </ng-container>
</main>

<div *ngIf="selectedTask" (clickOutside)="closeTaskDetail()">
  <app-task-detail
    [task]="selectedTask"
    [contacts]="contacts()"
    [isVisible]="showTaskDetail"
    (close)="closeTaskDetail()"
    (edit)="onEditTask($event)"
    (delete)="onDeleteTask($event)"
  >
  </app-task-detail>
</div>

<div *ngIf="showEditOverlay && taskToEdit" (clickOutside)="closeEditOverlay()">
  <app-add-task-view
    [isOverlay]="true"
    [taskToEdit]="taskToEdit"
    (close)="closeEditOverlay()"
    (taskSaved)="onTaskSaved($event)"
  >
  </app-add-task-view>
</div>

<div *ngIf="showAddTaskOverlay" (clickOutside)="closeAddTaskOverlay()">
  <app-add-task-view
    [isOverlay]="true"
    [initialStatus]="addTaskStatus"
    (close)="closeAddTaskOverlay()"
    (taskSaved)="onTaskCreated($event)"
  >
  </app-add-task-view>
</div>

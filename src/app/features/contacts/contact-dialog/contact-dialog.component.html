<div class="dialog-overlay" (click)="onClose()" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
  <app-loading-spinner [localLoading]="isSubmitting()" />

  <article class="dialog-container" stopPropagation>
    <button class="close-btn" (click)="onClose()" type="button" aria-label="Close dialog">
      <img src="assets/images/closeWhite.svg" alt="" aria-hidden="true" />
    </button>

    <aside class="dialog-left">
      <header class="branding">
        <img src="assets/images/joinlogowhite.svg" alt="Join Logo" class="logo" />
        <h1 id="dialog-title">{{ title }}</h1>
        <p>Tasks are better with a team!</p>
        <hr class="divider" aria-hidden="true" />
      </header>
    </aside>

    <section class="dialog-right">
      <div class="form-container">
        <figure class="avatar-section-desktop">
          <div class="avatar" [style.background-color]="avatarColor" [attr.aria-label]="avatarInitials ? 'Avatar with initials ' + avatarInitials : 'Default avatar'">
            <img
              *ngIf="!avatarInitials"
              src="assets/images/personwhite.svg"
              alt=""
              aria-hidden="true"
              class="avatar-icon" />
            <span *ngIf="avatarInitials" class="avatar-initials" aria-hidden="true">{{ avatarInitials }}</span>
          </div>
        </figure>

        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form" novalidate>
          <app-form-input
            id="firstName"
            label="First Name"
            [control]="$any(contactForm.get('firstName'))"
            type="text"
            placeholder="First Name"
            icon="assets/images/person.svg"
            [required]="true"
          />

          <app-form-input
            id="lastName"
            label="Last Name"
            [control]="$any(contactForm.get('lastName'))"
            type="text"
            placeholder="Last Name"
            icon="assets/images/person.svg"
            [required]="true"
          />

          <app-form-input
            id="email"
            label="Email"
            [control]="$any(contactForm.get('email'))"
            type="email"
            placeholder="Email"
            icon="assets/images/mail.svg"
            [required]="true"
            [readonly]="mode === 'edit'"
          />

          <app-form-input
            id="phone"
            label="Phone (optional)"
            [control]="$any(contactForm.get('phone'))"
            type="tel"
            placeholder="Phone (optional)"
            icon="assets/images/call.svg"
          />

          <output class="error-message general-error" *ngIf="errorMessage" role="alert" aria-live="assertive">
            {{ errorMessage }}
          </output>

          <footer class="button-group">
            <button
              *ngIf="mode === 'edit'"
              type="button"
              class="btn btn-secondary"
              (click)="onDelete()"
              aria-label="Delete contact">
              Delete
              <img src="assets/images/canceldarkblue.svg" alt="" aria-hidden="true" class="btn-icon" />
            </button>

            <button
              *ngIf="mode === 'add'"
              type="button"
              class="btn btn-secondary btn-cancel"
              (click)="onClose()"
              aria-label="Cancel">
              Cancel
              <img src="assets/images/canceldarkblue.svg" alt="" aria-hidden="true" class="btn-icon" />
            </button>

            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="!isFormValid || isSubmitting()"
              [attr.aria-busy]="isSubmitting()">
              {{ submitButtonText }}
              <img src="assets/images/check.svg" alt="" aria-hidden="true" class="btn-icon" />
            </button>
          </footer>
        </form>
      </div>
    </section>

    <figure class="avatar-section-mobile">
      <div class="avatar" [style.background-color]="avatarColor" [attr.aria-label]="avatarInitials ? 'Avatar with initials ' + avatarInitials : 'Default avatar'">
        <img
          *ngIf="!avatarInitials"
          src="assets/images/personwhite.svg"
          alt=""
          aria-hidden="true"
          class="avatar-icon" />
        <span *ngIf="avatarInitials" class="avatar-initials" aria-hidden="true">{{ avatarInitials }}</span>
      </div>
    </figure>
  </article>
</div>

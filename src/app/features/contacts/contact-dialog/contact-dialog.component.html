<div class="dialog-overlay" (click)="onClose()" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
  <app-loading-spinner [localLoading]="isBusy" />

  <article class="dialog-container" stopPropagation>
    <button class="close-btn" (click)="onClose()" type="button" aria-label="Close dialog">
      <img src="assets/images/closeWhite.svg" alt="" aria-hidden="true" />
    </button>

    <aside class="dialog-left">
      <header class="branding">
        <img src="assets/images/joinlogowhite.svg" alt="Join Logo" class="logo" />
        <h1 id="dialog-title">{{ title }}</h1>
        <p>Tasks are better with a team!</p>
        <hr class="divider" aria-hidden="true" />
      </header>
    </aside>

    <section class="dialog-right">
      <div class="form-container">
        <figure class="avatar-section-desktop">
          <label
            class="avatar-upload-trigger"
            dragDrop
            (filesDropped)="onDrop($event)"
            [attr.aria-label]="avatarInitials ? 'Avatar with initials ' + avatarInitials : 'Default avatar'"
            title="Upload profile image"
          >
            <input
              class="visually-hidden"
              type="file"
              accept="image/jpeg,image/png,.jpg,.jpeg,.png"
              (change)="onPick($event)"
            />
            <div class="avatar" [style.background-color]="avatarColor">
              <img
                *ngIf="avatarPreviewUrl()"
                [src]="avatarPreviewUrl()!"
                alt="Profile image preview"
                class="avatar-photo" />
              <img
                *ngIf="!avatarPreviewUrl() && !avatarInitials"
                src="assets/images/personwhite.svg"
                alt=""
                aria-hidden="true"
                class="avatar-icon" />
              <span *ngIf="!avatarPreviewUrl() && avatarInitials" class="avatar-initials" aria-hidden="true">{{ avatarInitials }}</span>
              <span class="avatar-add-icon" aria-hidden="true">
                @if (!avatarPreviewUrl()) {
                  <img src="assets/images/addDark.svg" alt="" role="presentation" />
                } @else {
                  <button
                    type="button"
                    class="avatar-action-btn"
                    (click)="onRemoveAvatarClick($event)"
                    aria-label="Remove image"
                    title="Remove image"
                  >
                    <span class="avatar-minus" aria-hidden="true"></span>
                  </button>
                }
              </span>
            </div>
          </label>
        </figure>

        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form" novalidate>
          <app-form-input
            id="firstName"
            label="First Name"
            [control]="$any(contactForm.get('firstName'))"
            type="text"
            placeholder="First Name"
            icon="assets/images/person.svg"
            [required]="true"
          />

          <app-form-input
            id="lastName"
            label="Last Name"
            [control]="$any(contactForm.get('lastName'))"
            type="text"
            placeholder="Last Name"
            icon="assets/images/person.svg"
            [required]="true"
          />

          <app-form-input
            id="email"
            label="Email"
            [control]="$any(contactForm.get('email'))"
            type="email"
            placeholder="Email"
            icon="assets/images/mail.svg"
            [required]="true"
            [readonly]="mode === 'edit'"
          />

          <app-form-input
            id="phone"
            label="Phone (optional)"
            [control]="$any(contactForm.get('phone'))"
            type="tel"
            placeholder="Phone (optional)"
            icon="assets/images/call.svg"
          />

          <output class="error-message general-error" *ngIf="errorMessage" role="alert" aria-live="assertive">
            {{ errorMessage }}
          </output>

          <footer class="button-group">
            <button
              *ngIf="mode === 'edit'"
              type="button"
              class="btn btn-secondary btn-icon"
              (click)="onDelete()"
              aria-label="Delete contact">
              Delete
              <img src="assets/images/canceldarkblue.svg" alt="" aria-hidden="true" class="btn-icon" />
            </button>

            <button
              *ngIf="mode === 'add'"
              type="button"
              class="btn btn-secondary btn-icon dialog-cancel-btn"
              (click)="onClose()"
              aria-label="Cancel">
              Cancel
              <img src="assets/images/canceldarkblue.svg" alt="" aria-hidden="true" class="btn-icon" />
            </button>

            <button
              type="submit"
              class="btn btn-primary btn-icon"
              [disabled]="!isFormValid || isBusy"
              [attr.aria-busy]="isBusy">
              {{ submitButtonText }}
              <img src="assets/images/check.svg" alt="" aria-hidden="true" class="btn-icon" />
            </button>
          </footer>
        </form>
      </div>
    </section>

    <figure class="avatar-section-mobile">
      <label
        class="avatar-upload-trigger"
        dragDrop
        (filesDropped)="onDrop($event)"
        [attr.aria-label]="avatarInitials ? 'Avatar with initials ' + avatarInitials : 'Default avatar'"
        title="Upload profile image"
      >
        <input
          class="visually-hidden"
          type="file"
          accept="image/jpeg,image/png,.jpg,.jpeg,.png"
          (change)="onPick($event)"
        />
        <div class="avatar" [style.background-color]="avatarColor">
          <img
            *ngIf="avatarPreviewUrl()"
            [src]="avatarPreviewUrl()!"
            alt="Profile image preview"
            class="avatar-photo" />
          <img
            *ngIf="!avatarPreviewUrl() && !avatarInitials"
            src="assets/images/personwhite.svg"
            alt=""
            aria-hidden="true"
            class="avatar-icon" />
          <span *ngIf="!avatarPreviewUrl() && avatarInitials" class="avatar-initials" aria-hidden="true">{{ avatarInitials }}</span>
          <span class="avatar-add-icon" aria-hidden="true">
            @if (!avatarPreviewUrl()) {
              <img src="assets/images/addDark.svg" alt="" role="presentation" />
            } @else {
              <button
                type="button"
                class="avatar-action-btn"
                (click)="onRemoveAvatarClick($event)"
                aria-label="Remove image"
                title="Remove image"
              >
                <span class="avatar-minus" aria-hidden="true"></span>
              </button>
            }
          </span>
        </div>
      </label>
    </figure>
  </article>
</div>

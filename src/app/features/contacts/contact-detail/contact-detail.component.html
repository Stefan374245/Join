<app-loading-spinner [localLoading]="isDeleting() || isUpdating()" />

<article class="contact-detail" *ngIf="contact() && !loading()">
  <header class="contact-detail__header">
    <h1>Contacts</h1>
    <button class="contact-detail__back-btn" (click)="goBack()" aria-label="Go back">
      <img src="assets/images/arrow-left-line.svg" alt="" aria-hidden="true" />
    </button>
  </header>
  
  <p class="contact-detail__subheader">Better with a team</p>
  
  <hr class="contact-detail__separator" aria-hidden="true" />

  <section class="contact-detail__info" aria-label="Contact profile">
    <figure class="contact-detail__avatar" [style.background-color]="contact()!.color">
      <span class="avatar-loader" *ngIf="isAvatarLoading(contact())">
        <app-loading-spinner [localLoading]="true" [inline]="true" [size]="28" />
      </span>
      <img
        *ngIf="contact()!.avatarUrl"
        [src]="contact()!.avatarUrl!"
        alt="{{ contact()!.firstName }} {{ contact()!.lastName }}"
        (load)="onAvatarLoad(contact()!)"
        (error)="onAvatarError(contact()!)"
        class="contact-detail__avatar-image" />
      <span *ngIf="!contact()!.avatarUrl">{{ contact()!.initials }}</span>
    </figure>

    <hgroup class="contact-detail__name">
      <h2>{{ contact()!.firstName }} {{ contact()!.lastName }}</h2>
    </hgroup>
  </section>
  
  <section class="contact-detail__details" aria-labelledby="contact-info-heading">
    <h3 id="contact-info-heading">Contact Information</h3>

    <dl class="contact-detail__item">
      <dt class="contact-detail__item-label">Email</dt>
      <dd>
        <a [href]="'mailto:' + contact()!.email" class="contact-detail__email">{{ contact()!.email }}</a>
      </dd>
    </dl>

    <dl class="contact-detail__item">
      <dt class="contact-detail__item-label">Phone</dt>
      <dd class="contact-detail__item-value">{{ contact()!.phone || '-' }}</dd>
    </dl>
  </section>

  <nav class="fab-menu" aria-label="Contact actions" (clickOutside)="closeActionMenu()">
    <button class="fab-menu__button" (click)="toggleActionMenu()" aria-label="More actions" aria-expanded="showActionMenu" aria-haspopup="menu">
      <img src="assets/images/more_vert.svg" alt="" aria-hidden="true" />
    </button>

    <menu class="fab-menu__popup" *ngIf="showActionMenu" role="menu">
      <li role="none">
        <button class="fab-menu__item" (click)="editContact()" role="menuitem">
          <img src="assets/images/edit-2.svg" alt="" aria-hidden="true" />
          <span>Edit</span>
        </button>
      </li>
      <li role="none">
        <button class="fab-menu__item" (click)="showDeleteConfirmation()" role="menuitem">
          <img src="assets/images/delete.svg" alt="" aria-hidden="true" />
          <span>Delete</span>
        </button>
      </li>
    </menu>
  </nav>

  <app-contact-dialog
    *ngIf="showDialog"
    [mode]="dialogMode"
    [contact]="contact()"
    [isSaving]="isUpdating()"
    (close)="closeDialog()"
    (save)="saveContact($event)"
    (delete)="handleDelete($event)">
  </app-contact-dialog>
</article>

<aside *ngIf="loading()" class="loading-state" role="status" aria-live="polite">
  Loading contact...
</aside>

<div
  class="confirm-dialog__overlay"
  *ngIf="showDeleteConfirm()"
  (click)="cancelDelete()"
  role="dialog"
  aria-modal="true"
  aria-labelledby="dialog-title">
  <div class="confirm-dialog" stopPropagation>
    <h3 id="dialog-title" class="confirm-dialog__title">Delete permanently?</h3>
    <p class="confirm-dialog__text" *ngIf="contact()">Delete contact {{ contact()!.firstName }} {{ contact()!.lastName }}?</p>
    <footer class="confirm-dialog__actions">
      <button class="btn btn-secondary" (click)="cancelDelete()">Cancel</button>
      <button class="btn btn-danger" (click)="confirmDelete()">Delete</button>
    </footer>
  </div>
</div>

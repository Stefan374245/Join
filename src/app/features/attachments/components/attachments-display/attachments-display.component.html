<section class="attachments-display" *ngIf="attachments().length > 0">
  <header class="attachments-header" *ngIf="!isEditMode() && attachments().length > 1">
    <button 
      class="btn-download-all"
      (click)="onDownloadAllAsZip($event)"
      title="Download all attachments as ZIP"
    >
      <img src="assets/images/download.svg" alt="Download" />
      Download All as ZIP ({{ attachments().length }})
    </button>
  </header>

  <ul class="attachments-grid">
    <li 
      class="attachment-card" 
      *ngFor="let attachment of visibleAttachments(); let i = index"
      (click)="onAttachmentClick($event, attachment, i)"
      (mouseenter)="setHoveredAttachment(attachment.id)"
      (mouseleave)="setHoveredAttachment(null)"
      [title]="attachment.filename"
    >
      <figure class="attachment-preview">
        <div class="loading-spinner" *ngIf="isImageLoading(attachment.id)">
          <div class="spinner"></div>
        </div>
        
        <img 
          [src]="getPreviewUrl(attachment)" 
          [alt]="attachment.filename"
          title="{{ attachment.filename }}"
          class="attachment-image"
          [class.loading]="isImageLoading(attachment.id)"
          (load)="onImageLoaded(attachment.id)"
          (loadstart)="onImageLoadStart(attachment.id)"
        />

        <div class="more-overlay" *ngIf="hasHidden() && i === maxVisible - 1">
          +{{ hiddenCount() }}
        </div>
        
        <button 
          *ngIf="isEditMode() && hoveredAttachment() === attachment.id"
          class="delete-button"
          (click)="onDeleteClick($event, attachment)"
          (mouseenter)="setHoveredDeleteButton(attachment.id)"
          (mouseleave)="setHoveredDeleteButton(null)"
          title="Delete attachment"
        >
          <img 
            [src]="getDeleteIcon(attachment.id)" 
            alt="Delete"
            class="delete-icon"
          />
        </button>

        <button 
          *ngIf="!isEditMode() && hoveredAttachment() === attachment.id"
          class="download-button"
          (click)="onDownloadClick($event, attachment)"
          (mouseenter)="setHoveredDownloadButton(attachment.id)"
          (mouseleave)="setHoveredDownloadButton(null)"
          title="Download attachment"
        >
          <img 
            [src]="getDownloadIcon(attachment.id)" 
            alt="Download"
            class="download-icon"
          />
        </button>
      </figure>
      <figcaption class="attachment-info">
        <span class="attachment-filename" [title]="attachment.filename">
          {{ attachment.filename }}
        </span>
        <span class="attachment-size">
          {{ formatFileSize(attachment.size) }}
        </span>
      </figcaption>
    </li>
  </ul>
</section>

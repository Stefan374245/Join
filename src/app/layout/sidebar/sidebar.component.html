<aside class="sidebar" [class.guest-sidebar]="!isAuthenticated()">
  <div class="sidebar-logo">
    <img src="assets/images/joinlogowhite.svg" alt="Join Logo" />
  </div>

  <nav class="sidebar-nav">
    <a
      *ngFor="let link of displayedNavLinks()"
      [routerLink]="link.path"
      routerLinkActive="active"
      class="nav-link">
      <img 
        [src]="link.iconGray" 
        [alt]="link.label" 
        class="icon-gray"
        title="icons" />
      @if (link.iconWhite) {
      <img 
        [src]="link.iconWhite" 
        [alt]="link.label" 
        class="icon-white"
        title="icons" />
      }
      <span>{{ link.label }}</span>
    </a>
  </nav>

  <div class="sidebar-legal">
    <a
      *ngFor="let link of legalLinks"
      [routerLink]="link.path"
      class="legal-link">
      {{ link.label }}
    </a>
  </div>
</aside>

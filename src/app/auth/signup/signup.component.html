<app-toast />
<main class="main-div" [class.show]="logoAnimationComplete">
  <div class="signup-logo-div">
      <img class="logo" src="assets/images/joinlogodark.svg" alt="Join Logo" />  <app-loading-spinner [localLoading]="isLoading()" />
  </div>

  <div class="main-content">
    <div class="signup-div">
      <div class="signup-header">
        <a routerLink="/login"
          ><img
            src="assets/images/arrow-left-line.svg"
            alt="Back to login"
            class="back-arrow"
        /></a>

        <h1 class="account-header">Sign up</h1>
      </div>

      <form [formGroup]="signupForm" class="signup-input-div" (ngSubmit)="signup()" (keydown.enter)="!isSignupButtonDisabled() && signup(); $event.preventDefault()" novalidate>
        <app-form-input
          id="nameInput"
          label="Name"
          [control]="$any(signupForm.get('name'))"
          type="text"
          placeholder="Name"
          icon="assets/images/person.svg"
          [required]="true"
        />

        <app-form-input
          id="emailInput"
          label="Email"
          [control]="$any(signupForm.get('email'))"
          type="email"
          placeholder="Email"
          icon="assets/images/mail.svg"
          [required]="true"
        />

        <div class="password-field-wrapper">
          <app-form-input
            id="passwordInput"
            label="Password"
            [control]="$any(signupForm.get('password'))"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Password"
            [required]="true"
          />
          <button 
            type="button" 
            (click)="togglePasswordVisibility(); $event.stopPropagation()" 
            (focus)="onPasswordFocus()"
            (blur)="onPasswordBlur()"
            class="password-toggle-btn"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            title="Toggle password visibility"
          >
            <img 
              [src]="getPasswordIcon()" 
              alt="" 
              aria-hidden="true" 
              class="password-icon"
              [class.active]="passwordFocused || signupForm.get('password')?.value"
            />
          </button>
        </div>

        <div class="password-field-wrapper">
          <app-form-input
            id="confirmPasswordInput"
            label="Confirm Password"
            [control]="$any(signupForm.get('confirmPassword'))"
            [type]="showConfirmPassword ? 'text' : 'password'"
            placeholder="Confirm Password"
            [required]="true"
          />
          <div class="error-container">
            @if (signupForm.hasError('passwordMismatch') && signupForm.get('confirmPassword')?.touched) {
              <output class="form-level-error" role="alert">Passwords do not match</output>
            }
          </div>
          <button 
            type="button" 
            (click)="toggleConfirmPasswordVisibility(); $event.stopPropagation()" 
            (focus)="onConfirmPasswordFocus()"
            (blur)="onConfirmPasswordBlur()"
            class="password-toggle-btn"
            [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
            title="Toggle password visibility"
          >
            <img 
              [src]="getConfirmPasswordIcon()" 
              alt="" 
              aria-hidden="true"
              class="password-icon"
              [class.active]="confirmPasswordFocused || signupForm.get('confirmPassword')?.value"
            />
          </button>
        </div>

        <div class="checkbox-div">
          <div class="custom-checkbox" (click)="togglePrivacy()">
            <input
              type="checkbox"
              id="privacyCheckbox"
              name="acceptPrivacy"
              [checked]="acceptPrivacy"
              class="privacy-checkbox"
              tabindex="0"
              (keydown.space)="$event.preventDefault(); togglePrivacy()"
              (keydown.enter)="$event.preventDefault(); togglePrivacy()"
            />
            <img
              [src]="acceptPrivacy ? 'assets/images/checkboxtrueblack.svg' : 'assets/images/checkboxfalseblack.svg'"
              alt="checkbox"
              class="checkbox-icon"
            />
          </div>
          <label for="privacyCheckbox" class="privacy-label" (click)="togglePrivacy()">
            I accept the
            <a routerLink="/privacy-policy" class="privacy-link" (click)="$event.stopPropagation()"
              >Privacy Policy</a
            >
          </label>
        </div>
      </form>

      <div class="signup-button-div">
        <div class="button-row">
          <button
            type="button"
            (click)="signup()"
            class="btn btn-primary"
            [disabled]="isSignupButtonDisabled()"
          >
            Sign up
          </button>
        </div>
      </div>
    </div>
  </div>

  <app-footer-auth />
</main>
